# CI fixture: representative production-shaped values for the inspire chart.
# Used by ci.yml to verify the chart renders under realistic configuration.
# NOT a deployable values file — image tags are placeholders.

global:
  imagePullSecrets:
    - spt-registry
  applicationName: "inspire"
  icm:
    adminPassOverrideSource:
      useSecret: true
      secretName: "spt-secrets"
      secretKey: "admin-pass"
  scaler:
    enabled: true
    # enabled: false
    passOverrideSource:
      useSecret: true
      secretName: "spt-secrets"
      secretKey: "admin-pass"
  interactive:
    enabled: true
    # enabled: false
    passOverrideSource:
      useSecret: true
      secretName: "spt-secrets"
      secretKey: "admin-pass"
  sen:
    # enabled: true
    enabled: false
    passOverrideSource:
      useSecret: true
      secretName: "spt-secrets"
      secretKey: "admin-pass"
  license:
    method: "CL"
    serverSource:
      useSecret: true
      secretName: "spt-secrets"
      secretKey: "license-server"
  dataRecording:
    prepareEnvironment: false

icm:
  image:
    name: "quadientdistribution.azurecr.io/flex/icm"
    tag: "17.0-latest"
  db:
    host: "inspire-db-postgresql-hl"
    port: "5432"
    userSource:
      useSecret: true
      secretName: "postgresql"
      secretKey: "postgres-user"
    passSource:
      useSecret: true
      secretName: "postgresql"
      secretKey: "postgres-password"
    name: "icm"
    type: "PostgreSql"
  useInitialServerSettings: true
  initialServerSettings:
    packageImportExport:
      overwriteExistingUsersOnImport: false
      overwriteExistingGroupsAndSyncPointsOnImport: false
      overwriteExistingApprovalStatesOnImport: false
      overwriteServerPropertiesOnImport: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits: {}

scaler:
  installationType: Cluster
  addJvmArguments: "-XX:MaxRAMPercentage=75.0"
  livenessProbe:
    initialDelaySeconds: 240
  image:
    name: "quadientdistribution.azurecr.io/flex/scaler"
    tag: "17.0-latest"
    ips:
      name: "quadientdistribution.azurecr.io/flex/ips"
      tag: "17.0-latest"
    sen:
      name: "quadientdistribution.azurecr.io/flex/scenario-engine"
      tag: "17.0-latest"
  db:
    host: "inspire-db-postgresql-hl"
    port: "5432"
    userSource:
      useSecret: true
      secretName: "postgresql"
      secretKey: "postgres-user"
    passSource:
      useSecret: true
      secretName: "postgresql"
      secretKey: "postgres-password"
    name: "scaler"
    type: "PostgreSql"
  sharedStorage:
    size: 2Gi
    existingClaim: "example-shared-storage"
  additionalStorage:
    enabled: false
    existingClaim: ""
  customLoggerConfigCM: example-logger-config
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1500m"
      memory: 3Gi
  ips:
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: "500m"
  sen:
    resources:
      requests:
        cpu: 150m
        memory: 1Gi
      limits: {}
    db:
      connectionString: "jdbc:postgresql://inspire-db-postgresql-hl:5432/scenario"
      userSource:
        useSecret: true
        secretName: "postgresql"
        secretKey: "postgres-user"
      passSource:
        useSecret: true
        secretName: "postgresql"
        secretKey: "postgres-password"
interactive:
  addJvmArguments: "-XX:MaxRAMPercentage=75.0"
  livenessProbe:
    initialDelaySeconds: 120
  image:
    name: "quadientdistribution.azurecr.io/flex/interactive"
    tag: "17.0-latest"
    ips:
      name: "quadientdistribution.azurecr.io/flex/ips"
      tag: "17.0-latest"
  db:
    host: "inspire-db-postgresql-hl"
    port: "5432"
    userSource:
      useSecret: true
      secretName: "postgresql"
      secretKey: "postgres-user"
    passSource:
      useSecret: true
      secretName: "postgresql"
      secretKey: "postgres-password"
    name: "interactive"
    type: "PostgreSql"
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: "1500m"
      memory: 3Gi
  productionEnvironment: false
  ips:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "500m"
  fulltext:
    enabled: false
    host: "http://inspire-es-elasticsearch:9200"
